<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麻將記分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F4F1EA;          /* 牌背米白 */
    --card: #FFFDF8;
    --ink: #1D2B24;
    --muted: #7A857F;
    --line: #E3DDD0;
    --felt: #1F5C46;        /* 牌桌綠 */
    --felt-ink: #F4F1EA;
    --win: #B83A2E;         /* 台灣習慣：紅色是贏 */
    --lose: #2E7D4F;
    --warn: #C98A16;
    --radius: 14px;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif; font-size: 16px; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  header { background: var(--felt); color: var(--felt-ink); padding: 18px 16px 14px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  header .sub { margin-top: 4px; font-size: 12px; opacity: .75; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px;
    background: rgba(255,255,255,.14); font-size: 11px; }

  nav { position: sticky; top: 0; z-index: 5; display: flex; background: var(--felt);
    padding: 0 8px; gap: 4px; border-bottom: 1px solid rgba(0,0,0,.15); }
  nav button { flex: 1; background: none; border: 0; color: rgba(244,241,234,.6);
    font: inherit; font-size: 14px; padding: 10px 0 12px; position: relative; }
  nav button.on { color: var(--felt-ink); font-weight: 700; }
  nav button.on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 4px;
    height: 3px; border-radius: 3px; background: #E9C46A; }

  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  section { display: none; } section.on { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pos { color: var(--win); } .neg { color: var(--lose); }

  /* 記分 */
  .row { display: grid; grid-template-columns: 1fr 44px 112px; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sign { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
    font: 700 20px var(--mono); color: var(--win); }
  .sign.minus { color: var(--lose); }
  .row input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; font: 600 18px var(--mono); text-align: right; padding: 0 12px; color: var(--ink); }
  .row input:focus { outline: 2px solid var(--felt); outline-offset: -1px; }

  .sumbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
    border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: none; gap: 10px; align-items: center; }
  .sumbar.on { display: flex; }
  .sumbar .sum { flex: 1; }
  .sumbar .sum b { font: 700 22px var(--mono); }
  .btn { height: 46px; padding: 0 18px; border-radius: 12px; border: 0; font: inherit;
    font-weight: 700; background: var(--felt); color: var(--felt-ink); }
  .btn:disabled { opacity: .35; }
  .btn.ghost { background: transparent; color: var(--felt); border: 1px solid var(--felt); }
  .btn.small { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline input, select { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    padding: 0 12px; font: inherit; background: #fff; color: var(--ink); }

  /* 排行 */
  .rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: 0; }
  .medal { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    font: 700 13px var(--mono); background: var(--bg); color: var(--muted); }
  .rank:nth-child(1) .medal { background: #E9C46A; color: #5A4300; }
  .rank:nth-child(2) .medal { background: #D9D9D9; color: #444; }
  .rank:nth-child(3) .medal { background: #E3B08A; color: #5B3214; }
  .rank .total { font: 700 18px var(--mono); text-align: right; }
  .rank .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 紀錄 */
  .game { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .game .scores { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 14px; }
  .del { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px; }
  .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
  .datefix { display: flex; gap: 6px; margin-top: 8px; }
  .datefix input { flex: 1; height: 36px; border-radius: 10px; border: 1px solid var(--line); padding: 0 10px; font: inherit; background: #fff; color: var(--ink); }
  .daterow label { align-self: center; flex: none; font-size: 14px; color: var(--muted); }
  .daterow input { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); padding: 0 12px; font: inherit; background: #fff; color: var(--ink); }
  .daterow.past input { border-color: var(--warn); background: #FFF6DE; }
  .datehint { display: none; font-size: 12px; color: var(--warn); margin-top: 4px; }

  /* 拆兩桌 */
  .split { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .split h4 { margin: 8px 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .cands { display: grid; gap: 6px; }
  .cand { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px;
    font: inherit; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .cand.on { border-color: var(--felt); box-shadow: inset 0 0 0 1px var(--felt); background: #F3F8F5; }
  .cand b { font-weight: 700; }
  .assign { display: grid; gap: 4px; }
  .arow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 4px 10px; font: inherit; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--felt); color: var(--felt-ink); }
  .tsum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .tsum div { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 13px; }
  .tsum .ok { color: var(--lose); } .tsum .bad { color: var(--warn); font-weight: 700; }
  .split .inline { margin-top: 10px; }
  .partrow { display: flex; align-items: center; gap: 6px; margin: 2px 0 6px 12px; font-size: 13px; color: var(--muted); }
  .partrow input { width: 96px; height: 34px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px;
    font: 600 15px var(--mono); text-align: right; background: #fff; color: var(--ink); }
  .partrow .pm { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font: 700 16px var(--mono); color: var(--ink); }
  .partrow b { color: var(--ink); min-width: 56px; }

  /* 分析 */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kpi .k { font-size: 12px; color: var(--muted); }
  .kpi .v { font: 700 20px var(--mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .s { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card h3 + .muted { margin-bottom: 8px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { font-weight: 500; font-size: 12px; color: var(--muted); text-align: right; padding: 4px 0 6px; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t td { padding: 7px 0; border-top: 1px solid var(--line); text-align: right; }
  table.t td:first-child { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.t tr.few td { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px; margin-left: 4px;
    background: var(--bg); color: var(--muted); vertical-align: 1px; }
  .verdict { border-left: 4px solid var(--felt); }
  .verdict .vh { font-size: 19px; font-weight: 700; line-height: 1.4; }
  .verdict ul { list-style: none; padding: 0; margin: 10px 0 0; }
  .verdict li { padding: 5px 0; font-size: 15px; border-top: 1px dashed var(--line); }
  .bars { display: flex; gap: 3px; height: 110px; margin-top: 8px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; padding: 0; border: 0; background: none; min-width: 0; cursor: pointer; }
  .bars .u, .bars .d { flex: 1; display: flex; }
  .bars .u { align-items: flex-end; border-bottom: 1px solid var(--muted); }
  .bars .d { align-items: flex-start; }
  .bars i { display: block; width: 100%; min-height: 2px; }
  .bars i.up { background: var(--win); border-radius: 3px 3px 0 0; }
  .bars i.dn { background: var(--lose); border-radius: 0 0 3px 3px; }
  .bars .b.sel i { outline: 2px solid var(--ink); }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 2px 0 8px; }
  .dlist { margin-top: 6px; }
  .drow { display: grid; grid-template-columns: 6.5em 1fr 4.2em; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  summary.drow { list-style: none; cursor: pointer; }
  summary.drow::-webkit-details-marker, .fold summary::-webkit-details-marker, details.sub summary::-webkit-details-marker { display: none; }
  .drow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .drow .nm small { display: block; font-size: 11px; color: var(--muted); }
  .drow .val { text-align: right; font-weight: 700; font-size: 14px; }
  .drow-wrap.few { opacity: .55; }
  .drow-wrap .more { font-size: 13px; color: var(--muted); padding: 0 0 10px; }
  .dbar { position: relative; height: 12px; }
  .dbar::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--muted); opacity: .5; }
  .dbar i { position: absolute; top: 0; bottom: 0; }
  .dbar i.up { background: var(--win); border-radius: 0 4px 4px 0; }
  .dbar i.dn { background: var(--lose); border-radius: 4px 0 0 4px; }
  details.sub { margin-top: 6px; }
  details.sub summary { list-style: none; }
  .fold summary { list-style: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .fold summary h3 { margin: 0; }
  .fold[open] summary .muted { display: none; }
  .fold[open] summary { margin-bottom: 6px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pick { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card);
    border-radius: 99px; padding: 5px 10px; font: inherit; font-size: 13px; color: var(--muted); }
  .pick i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .pick.on { color: var(--ink); border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); font-weight: 700; }
  .pick.on i { background: var(--c); }
  .pick .num { font-size: 12px; font-weight: 400; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .linkbtn { background: none; border: 0; padding: 6px 0 0; color: var(--felt); font: inherit; font-size: 13px; }

  .banner { background: #FFF6DE; border-color: #F0DDA6; }
  .empty { text-align: center; padding: 36px 12px; color: var(--muted); }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 20;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.on { opacity: 1; }
  #loading { padding: 80px 16px; text-align: center; color: var(--muted); }
  .foot { text-align: center; font-size: 11px; color: var(--muted); padding: 20px 0 0; }
</style>
</head>
<body>
<div id="loading">載入中…</div>
<div id="app" hidden>
  <header>
    <h1 id="roomName"></h1>
    <div class="sub"><span id="roomMeta"></span><span id="roleChip" class="chip"></span></div>
  </header>
  <nav id="tabs"></nav>
  <main>
    <div id="claimBox"></div>

    <section id="tab-record">
      <div class="card">
        <div class="muted" style="margin-bottom:4px">輸入這一場每位玩家的得失分，沒上桌的留空。</div>
        <div id="rows"></div>
        <div class="inline daterow" id="dateRow">
          <label for="playDate">日期</label>
          <input type="date" id="playDate">
          <button class="btn small ghost" id="todayBtn" type="button">今天</button>
        </div>
        <div class="datehint" id="dateHint"></div>
        <div id="splitRec" style="display:none;margin-top:10px">
          <button class="btn small ghost" id="splitRecBtn" type="button">這是兩桌一起的分數？分兩桌記</button>
          <div id="splitRecHost"></div>
        </div>
        <div class="inline">
          <input id="note" placeholder="備註（選填，例如：第3將）" maxlength="100">
        </div>
      </div>
      <div class="card">
        <div class="muted">新增玩家</div>
        <div class="inline">
          <input id="newName" placeholder="名字" maxlength="20">
          <button class="btn small ghost" id="addBtn">加入</button>
        </div>
      </div>
    </section>

    <section id="tab-rank"><div class="card" id="rankList"></div></section>

    <section id="tab-analysis">
      <div class="card">
        <div class="muted">以誰為主角？</div>
        <div class="inline" style="margin-top:6px"><select id="anPlayer" aria-label="選擇玩家"></select></div>
      </div>
      <div class="muted" id="anHouseNote" style="margin:-4px 2px 10px"></div>
      <div id="anBody"></div>
    </section>

    <section id="tab-trend">
      <div class="muted" style="margin:0 2px 8px">點名字選要看誰（最多 6 人），其他人是淡灰色的線。</div>
      <div class="picks" id="trendPick"></div>
      <div class="card" style="height:320px"><canvas id="chart"></canvas></div>
      <div class="card empty" id="chartEmpty" hidden>還沒有任何對局</div>
      <div class="muted">每一點是該場結束後的累計分數，台費帳戶不列入。</div>
    </section>

    <section id="tab-history"><div id="history"></div></section>

    <div class="foot">分數僅作為遊戲紀錄，不具任何金錢價值</div>
  </main>
</div>

<div class="sumbar" id="sumbar">
  <div class="sum"><div class="muted">總和（需為 0）</div><b id="sum" class="num">0</b></div>
  <button class="btn ghost small" id="fillBtn" title="把剩下一位補成讓總和為 0">補平</button>
  <button class="btn" id="saveBtn" disabled>記這場</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 設定：部署前改成你的值 =====
// LIFF_ID 維持 "YOUR_LIFF_ID" 時是「試玩模式」，不需要 LINE 和後端，資料只存在這台裝置。
const LIFF_ID  = "2011866186-iudTebek";
// 你的伺服器網址 + /api，例如：
//   本機＋通道：https://xxxx.trycloudflare.com/api
//   Supabase： https://<專案ref>.supabase.co/functions/v1/mj/api
const API_BASE = "https://hofjzjhqizukceosjufr.supabase.co/functions/v1/mj/api";
// =================================

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const signed = (n) => (n > 0 ? "+" : "") + n;
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");

let idToken = "", roomCode = "", data = null, chart = null;
const entry = {}; // player_id -> { sign: 1|-1, value: "" }

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200);
}

// ---------- 試玩模式：還沒設定 LIFF_ID，或網址帶 ?demo=1 ----------
const DEMO = LIFF_ID === "YOUR_LIFF_ID" || new URLSearchParams(location.search).get("demo") === "1";

const demo = (() => {
  const KEY = "mj-demo-v1";
  const uid = () => Math.random().toString(36).slice(2, 10);
  const seed = () => {
    const names = ["小明", "阿華", "老王", "阿美"];
    const players = names.map((name) => ({ id: uid(), name, line_user_id: null }));
    const rounds = [[120, -40, -50, -30], [-60, 90, -10, -20], [30, 30, -100, 40], [-20, -30, 80, -30], [150, -50, -50, -50]];
    const t0 = Date.now() - rounds.length * 3600e3;
    const games = rounds.map((_, i) => ({ id: uid(), played_at: new Date(t0 + i * 3600e3).toISOString(), note: i === 0 ? "東風" : null }));
    const scores = rounds.flatMap((r, i) => r.map((points, j) => ({ game_id: games[i].id, player_id: players[j].id, points })));
    return { players, games, scores };
  };
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { db = seed(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  const ME = "demo-admin";

  function standings() {
    const m = new Map(db.players.map((p) => [p.id, { player_id: p.id, name: p.name, total: 0, games: 0, wins: 0, winRate: 0, avg: 0, best: 0, worst: 0 }]));
    for (const s of db.scores) {
      const st = m.get(s.player_id); if (!st) continue;
      if (!st.games) { st.best = st.worst = s.points; }
      st.total += s.points; st.games++; if (s.points > 0) st.wins++;
      st.best = Math.max(st.best, s.points); st.worst = Math.min(st.worst, s.points);
    }
    const list = [...m.values()];
    for (const st of list) { st.winRate = st.games ? st.wins / st.games : 0; st.avg = st.games ? Math.round(st.total / st.games * 10) / 10 : 0; }
    return list.sort((a, b) => b.total - a.total || b.games - a.games);
  }
  function series() {
    const run = new Map(db.players.map((p) => [p.id, 0]));
    const out = db.players.map((p) => ({ player_id: p.id, name: p.name, values: [] }));
    for (const g of db.games) {
      for (const sr of out) {
        const s = db.scores.find((x) => x.game_id === g.id && x.player_id === sr.player_id);
        run.set(sr.player_id, run.get(sr.player_id) + (s ? s.points : 0));
        sr.values.push(run.get(sr.player_id));
      }
    }
    return { labels: db.games.map((_, i) => `#${i + 1}`), series: out };
  }
  const name = (id) => db.players.find((p) => p.id === id)?.name ?? "?";

  return async function (path, opts = {}) {
    const body = opts.body ? JSON.parse(opts.body) : {};
    const route = path.split("?")[0];
    if (route === "room") {
      return {
        room: { name: "試玩房間", code: "DEMO01", linked: false },
        me: { isAdmin: true, player: db.players.find((p) => p.line_user_id === ME)?.id ?? null },
        players: db.players.map((p) => ({ id: p.id, name: p.name, claimed: !!p.line_user_id, house: !!p.is_house })),
        standings: standings(), series: series(), totalGames: db.games.length,
        recent: db.games.map((g, i) => ({ g, no: i + 1 })).slice(-30).reverse().map(({ g, no }) => ({
          id: g.id, played_at: g.played_at, note: g.note, no,
          scores: db.scores.filter((s) => s.game_id === g.id).map((s) => ({ player_id: s.player_id, name: name(s.player_id), points: s.points })).sort((a, b) => b.points - a.points),
        })),
      };
    }
    if (route === "game") {
      const sc = body.scores || [];
      if (sc.length < 2) throw new Error("至少需要兩位玩家");
      const sum = sc.reduce((a, s) => a + s.points, 0);
      if (sum !== 0) throw new Error(`分數總和必須為 0（目前 ${sum}）`);
      const g = { id: uid(), played_at: body.played_at || new Date().toISOString(), note: body.note || null };
      db.games.push(g); for (const s of sc) db.scores.push({ game_id: g.id, ...s });
      db.games.sort((a, b) => a.played_at.localeCompare(b.played_at)); save(); return { ok: true };
    }
    if (route === "game/split") {
      const g = db.games.find((x) => x.id === body.game_id);
      if (!g) throw new Error("找不到這一場");
      const base = new Date(g.played_at).getTime();
      body.tables.forEach((t, i) => {
        if (t.reduce((a, e) => a + e.points, 0) !== 0) throw new Error(`第 ${i + 1} 桌的總和不是 0`);
      });
      body.tables.forEach((t, i) => {
        const ng = { id: uid(), played_at: new Date(base + i).toISOString(), note: [g.note, `第${i + 1}桌`].filter(Boolean).join("・") };
        db.games.push(ng); for (const e of t) db.scores.push({ game_id: ng.id, player_id: e.player_id, points: e.points });
      });
      db.games = db.games.filter((x) => x.id !== g.id); db.scores = db.scores.filter((s) => s.game_id !== g.id);
      db.games.sort((a, b) => a.played_at.localeCompare(b.played_at)); save(); return { ok: true };
    }
    if (route === "game/date") {
      const g = db.games.find((x) => x.id === body.game_id);
      if (!g) throw new Error("找不到這一場");
      g.played_at = body.played_at; db.games.sort((a, b) => a.played_at.localeCompare(b.played_at)); save(); return { ok: true };
    }
    if (route === "game/delete") {
      db.games = db.games.filter((g) => g.id !== body.game_id);
      db.scores = db.scores.filter((s) => s.game_id !== body.game_id); save(); return { ok: true };
    }
    if (route === "player") {
      const n = String(body.name || "").trim();
      if (!n || /[0-9+\-]/.test(n)) throw new Error("名字不能空白，也不能有數字或 +、-");
      if (db.players.some((p) => p.name === n)) throw new Error("這個名字已經存在");
      db.players.push({ id: uid(), name: n, line_user_id: null }); save(); return { ok: true };
    }
    if (route === "analysis") {
      const pid = new URLSearchParams(path.split("?")[1] || "").get("player");
      const a = analyzeLocal(pid, db.players, db.games, db.scores);
      if (!a) throw new Error("找不到這位玩家");
      return { ...a, minPairGames: 3 };
    }
    if (route === "claim") {
      const p = db.players.find((x) => x.id === body.player_id);
      if (!p || p.line_user_id) throw new Error("這個名字已經被認領");
      p.line_user_id = ME; save(); return { ok: true };
    }
    throw new Error("not found");
  };
})();

async function api(path, opts = {}) {
  if (DEMO) return demo(path, opts);
  const res = await fetch(`${API_BASE}/${path}`, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}`, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `錯誤 ${res.status}`);
  return body;
}
const post = (path, payload) => api(path, { method: "POST", body: JSON.stringify({ code: roomCode, ...payload }) });

function readRoomCode() {
  const p = new URLSearchParams(location.search);
  if (p.get("room")) return p.get("room");
  const state = p.get("liff.state"); // 初始化前的轉址參數
  if (state) return new URLSearchParams(state.split("?")[1] || "").get("room");
  return "";
}

async function boot() {
  try {
    if (DEMO) {
      roomCode = "DEMO01";
      await load();
      $("#loading").hidden = true; $("#app").hidden = false;
      return;
    }
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error("拿不到 LINE 登入資訊：請在 LIFF 設定的 Scopes 勾選 openid");
    // 外部瀏覽器可能留著過期的 token，重新登入一次
    const exp = (liff.getDecodedIDToken() || {}).exp || 0;
    if (exp * 1000 < Date.now() + 60e3 && !liff.isInClient()) {
      liff.logout(); liff.login({ redirectUri: location.href }); return;
    }
    roomCode = readRoomCode();
    if (!roomCode) throw new Error("連結缺少房號，請從群組裡的「開啟記分頁」按鈕進入");
    await load();
    $("#loading").hidden = true; $("#app").hidden = false;
  } catch (e) {
    $("#loading").textContent = e.message || String(e);
  }
}

async function load() {
  data = await api(`room?code=${encodeURIComponent(roomCode)}`);
  anCache.clear();
  render();
}

// ---------- render ----------
let currentTab = null;
function render() {
  const { room, me, totalGames } = data;
  document.title = room.name;
  $("#roomName").textContent = room.name;
  $("#roomMeta").textContent = `房號 ${room.code}・共 ${totalGames} 場` + (DEMO ? "・試玩模式（資料只存在這台裝置）" : "");
  $("#roleChip").textContent = me.isAdmin ? "管理員" : "成員";

  const tabs = [
    ...(me.isAdmin ? [["record", "記分"]] : []),
    ["rank", "排行"], ["analysis", "分析"], ["trend", "走勢"], ["history", "紀錄"],
  ];
  if (!currentTab || !tabs.some(([k]) => k === currentTab)) currentTab = tabs[0][0];
  $("#tabs").innerHTML = tabs.map(([k, label]) =>
    `<button data-tab="${k}" class="${k === currentTab ? "on" : ""}">${label}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { currentTab = b.dataset.tab; render(); });
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("on", s.id === `tab-${currentTab}`));
  $("#sumbar").classList.toggle("on", currentTab === "record");

  renderClaim(); renderRows(); renderRank(); renderHistory();
  if (currentTab === "trend") renderChart();
  if (currentTab === "analysis") renderAnalysis();
}

function renderClaim() {
  const { me, players } = data;
  const open = players.filter((p) => !p.claimed);
  if (me.player || !open.length) { $("#claimBox").innerHTML = ""; return; }
  $("#claimBox").innerHTML = `
    <div class="card banner">
      <div style="font-weight:700">你是哪一位？</div>
      <div class="muted">認領後就能把這個名字的戰績連到你的 LINE。</div>
      <div class="inline">
        <select id="claimSel">${open.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
        <button class="btn small" id="claimBtn">認領</button>
      </div>
    </div>`;
  $("#claimBtn").onclick = async () => {
    try { await post("claim", { player_id: $("#claimSel").value }); toast("已認領"); await load(); }
    catch (e) { toast(e.message); }
  };
}

function renderRows() {
  if (!data.me.isAdmin) return;
  syncDateRow();
  for (const p of data.players) entry[p.id] ??= { sign: 1, value: "" };
  $("#rows").innerHTML = data.players.length ? data.players.map((p) => `
    <div class="row" data-id="${p.id}">
      <div class="name">${esc(p.name)}</div>
      <button class="sign ${entry[p.id].sign < 0 ? "minus" : ""}" aria-label="切換正負">${entry[p.id].sign < 0 ? "−" : "+"}</button>
      <input inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${entry[p.id].value}">
    </div>`).join("") : `<div class="empty">還沒有玩家，先在下面新增</div>`;

  $("#rows").querySelectorAll(".row").forEach((row) => {
    const id = row.dataset.id, btn = row.querySelector(".sign"), input = row.querySelector("input");
    btn.onclick = () => {
      entry[id].sign *= -1;
      btn.classList.toggle("minus", entry[id].sign < 0);
      btn.textContent = entry[id].sign < 0 ? "−" : "+";
      updateSum();
    };
    input.oninput = () => {
      // 允許直接輸入負號
      let v = input.value.replace(/[^\d-]/g, "");
      if (v.startsWith("-")) { entry[id].sign = -1; btn.classList.add("minus"); btn.textContent = "−"; v = v.slice(1); }
      v = v.replace(/-/g, "");
      input.value = v; entry[id].value = v; updateSum();
    };
  });
  updateSum();
}

function currentScores() {
  return data.players
    .filter((p) => entry[p.id] && entry[p.id].value !== "")
    .map((p) => ({ player_id: p.id, points: entry[p.id].sign * parseInt(entry[p.id].value, 10) }));
}

function updateSum() {
  const sc = currentScores();
  const sum = sc.reduce((a, s) => a + s.points, 0);
  const el = $("#sum");
  el.textContent = signed(sum);
  el.style.color = sum === 0 ? "var(--ink)" : "var(--warn)";
  $("#saveBtn").disabled = !(sum === 0 && sc.filter((s) => s.points !== 0).length >= 2);
  // 填了 4 人以上（不算台費帳戶）且總和為 0，才提供「分兩桌記」
  const canSplit = sum === 0 && sc.filter((s) => !isHouse(s.player_id)).length >= 4;
  $("#splitRec").style.display = canSplit ? "block" : "none";
  if (!canSplit) $("#splitRecHost").innerHTML = "";
  const blanks = data.players.filter((p) => entry[p.id]?.value === "");
  $("#fillBtn").disabled = !(sum !== 0 && blanks.length === 1 && sc.length >= 1);
}

$("#fillBtn").onclick = () => {
  const sum = currentScores().reduce((a, s) => a + s.points, 0);
  const blank = data.players.find((p) => entry[p.id]?.value === "");
  if (!blank) return;
  entry[blank.id] = { sign: sum > 0 ? -1 : 1, value: String(Math.abs(sum)) };
  renderRows();
};

// ---------- 日期 ----------
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
/** 選定的日期＋某個時刻（保留時分秒，同一天補記多場時順序才不會亂） */
function dateWithTime(dateStr, timeFrom = new Date()) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const t = new Date(timeFrom);
  t.setFullYear(y, m - 1, d);
  return t.toISOString();
}
function syncDateRow() {
  const el = $("#playDate");
  el.max = todayStr();
  if (!el.value) el.value = todayStr();
  const past = el.value !== todayStr();
  $("#dateRow").classList.toggle("past", past);
  $("#dateHint").textContent = past ? `會記在 ${el.value.replaceAll("-", "/")}，不是今天` : "";
  $("#dateHint").style.display = past ? "block" : "none";
}
$("#playDate").onchange = syncDateRow;
$("#todayBtn").onclick = () => { $("#playDate").value = todayStr(); syncDateRow(); };

$("#saveBtn").onclick = async () => {
  const btn = $("#saveBtn"); btn.disabled = true;
  try {
    const d = $("#playDate").value || todayStr();
    if (d > todayStr()) throw new Error("日期不能是未來");
    await post("game", {
      scores: currentScores(), note: $("#note").value.trim(),
      ...(d !== todayStr() ? { played_at: dateWithTime(d) } : {}),
    });
    for (const k in entry) entry[k] = { sign: 1, value: "" };
    $("#note").value = "";
    toast(DEMO ? "已記錄" : "已記錄，並通知群組");
    await load();
  } catch (e) { toast(e.message); updateSum(); }
};

$("#splitRecBtn").onclick = () => {

  host.innerHTML = "";
  const names = new Map(data.players.map((p) => [p.id, p.name]));

        });

      for (const k in entry) entry[k] = { sign: 1, value: "" };
      $("#note").value = "";
      toast(DEMO ? "已分兩桌記錄" : "已分兩桌記錄，並通知群組");

  });
};

$("#addBtn").onclick = async () => {

  if (!name) return;
  try { await post("player", { name }); $("#newName").value = ""; toast(`已加入 ${name}`); await load(); }

function renderRank() {

        <div class="meta">${s.games} 場・勝率 ${Math.round(s.winRate * 100)}%・場均 <span class="num">${signed(s.avg)}</span>・最佳 <span class="num">${signed(s.best)}</span></div>
      </div>

// ---------- 分析 ----------
let anPlayerId = null;
let anShowAllTables = false;
const anCache = new Map(); // player_id -> analysis（資料更新時清掉）

function renderAnalysis() {
  const sel = $("#anPlayer");
  const house = new Set(data.players.filter((p) => p.house).map((p) => p.id));
  const list = data.standings.filter((s) => s.games > 0 && !house.has(s.player_id));
  if (!list.length) { sel.innerHTML = ""; $("#anBody").innerHTML = `<div class="card empty">還沒有任何對局</div>`; return; }
  const houseNames = data.players.filter((p) => p.house).map((p) => p.name);
  if (!anPlayerId || !list.some((s) => s.player_id === anPlayerId)) {
    anPlayerId = (data.me.player && list.some((s) => s.player_id === data.me.player)) ? data.me.player : list[0].player_id;
  }
  sel.innerHTML = list.map((s) => `<option value="${s.player_id}" ${s.player_id === anPlayerId ? "selected" : ""}>${esc(s.name)}${s.player_id === data.me.player ? "（我）" : ""}</option>`).join("");
  $("#anHouseNote").textContent = houseNames.length ? `「${houseNames.join("、")}」是台費帳戶，不列入分析。` : "";
  sel.onchange = () => { anPlayerId = sel.value; anShowAllTables = false; renderAnalysis(); };
  const cached = anCache.get(anPlayerId);
  if (cached) return drawAnalysis(cached);
  $("#anBody").innerHTML = `<div class="card empty">計算中…</div>`;
  const want = anPlayerId;
  api(`analysis?code=${encodeURIComponent(roomCode)}&player=${encodeURIComponent(want)}`)
    .then((a) => { anCache.set(want, a); if (want === anPlayerId && currentTab === "analysis") drawAnalysis(a); })
    .catch((e) => { $("#anBody").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
}

function drawAnalysis(a) {
  const min = a.minPairGames || 3;
  const pctS = (r) => `${Math.round(r * 100)}%`;
  const day = (iso) => new Date(iso).toLocaleDateString("zh-TW", { month: "numeric", day: "numeric" });
  const r0 = (n) => signed(Math.round(n));
  const kpi = (k, v, sub = "") => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  // 長條：v 在 -max~max 之間，從中線往左（輸）或往右（贏）畫
  const dbar = (v, max) => {
    const w = max ? Math.min(50, Math.abs(v) / max * 50) : 0;
    return `<div class="dbar"><i class="${v >= 0 ? "up" : "dn"}" style="${v >= 0 ? "left" : "right"}:50%;width:${w}%"></i></div>`;
  };

  // 名次（不含台費帳戶）
  const house = new Set(data.players.filter((p) => p.house).map((p) => p.id));
  const ranked = data.standings.filter((s) => s.games > 0 && !house.has(s.player_id));
  const rank = ranked.findIndex((s) => s.player_id === a.player_id) + 1;
  const n = ranked.length;

  // 剋星 / 提款機：同桌滿 min 場的人裡，平均分差最低 / 最高
  const partnerOf = new Map(a.partners.map((p) => [p.player_id, p]));
  const opp = a.rivals.map((r) => ({ ...r, p: partnerOf.get(r.player_id) }));
  const solid = opp.filter((r) => r.games >= min);
  const few = opp.filter((r) => r.games < min);
  const nemesis = solid.length && solid[solid.length - 1].avgDiff < 0 ? solid[solid.length - 1] : null;
  const atm = solid.length && solid[0].avgDiff > 0 ? solid[0] : null;

  // ── 一句話總結 ──
  const head = a.total > 0 ? (rank === 1 ? "目前全房最大贏家 👑" : `整體贏 ${a.total}`)
    : a.total < 0 ? (rank === n && n > 1 ? `目前全房輸最多` : `整體輸 ${-a.total}`) : "整體打平";
  const pts = (a.recent || []).map((g) => g.points);
  const sd = pts.length > 1 ? Math.sqrt(pts.reduce((s, p) => s + (p - a.avg) ** 2, 0) / pts.length) : 0;
  const bullets = [];
  if (a.games >= 10) {
    const d = a.last10Avg - a.avg;
    if (d > sd * 0.25) bullets.push(`🔥 最近 10 場手感變好：場均 <b class="num ${cls(a.last10Avg)}">${r0(a.last10Avg)}</b>（平常 ${r0(a.avg)}）`);
    else if (d < -sd * 0.25) bullets.push(`❄️ 最近 10 場轉冷：場均 <b class="num ${cls(a.last10Avg)}">${r0(a.last10Avg)}</b>（平常 ${r0(a.avg)}）`);
    else bullets.push(`➖ 最近 10 場跟平常差不多（場均 ${r0(a.last10Avg)}）`);
  }
  if (a.streak >= 3) bullets.push(`📈 目前連勝 <b>${a.streak}</b> 場`);
  if (a.streak <= -3) bullets.push(`📉 目前連敗 <b>${-a.streak}</b> 場`);
  if (nemesis) bullets.push(`😈 最怕 <b>${esc(nemesis.name)}</b>：同桌平均輸他 <b class="num neg">${Math.round(-nemesis.avgDiff)}</b>`);
  if (atm) bullets.push(`💰 最會贏 <b>${esc(atm.name)}</b>：同桌平均贏他 <b class="num pos">${Math.round(atm.avgDiff)}</b>`);
  if (!solid.length) bullets.push(`<span class="muted">同桌滿 ${min} 場才會分析剋星和提款機</span>`);
  const verdict = `<div class="card verdict">
    <div class="vh">${esc(a.name)}：<span class="${cls(a.total)}">${head}</span></div>
    <div class="muted">${n > 1 ? `第 ${rank} 名 / ${n} 人・` : ""}共 ${a.games} 場</div>
    ${bullets.length ? `<ul>${bullets.map((b) => `<li>${b}</li>`).join("")}</ul>` : ""}
  </div>`;

  // ── 三個大數字 ──
  const kpis = `<div class="kpis">
    ${kpi("累計", `<span class="${cls(a.total)}">${signed(a.total)}</span>`, n > 1 ? `第 ${rank} 名` : "")}
    ${kpi("場均", `<span class="${cls(a.avg)}">${r0(a.avg)}</span>`, `${a.games} 場`)}
    ${kpi("勝率", pctS(a.winRate), `${a.wins} 勝 ${a.games - a.wins} 敗`)}
  </div>`;

  // ── 最近幾場的輸贏長條 ──
  const rec = a.recent || [];
  const maxRec = Math.max(1, ...rec.map((g) => Math.abs(g.points)));
  const bars = rec.map((g, i) => {
    const h = Math.abs(g.points) / maxRec * 100;
    return `<button class="b" data-i="${i}" aria-label="${day(g.played_at)} ${signed(g.points)}">
      <span class="u">${g.points > 0 ? `<i class="up" style="height:${h}%"></i>` : ""}</span>
      <span class="d">${g.points < 0 ? `<i class="dn" style="height:${h}%"></i>` : ""}</span></button>`;
  }).join("");
  const bestWorst = `${a.best ? `最好 <b class="num ${cls(a.best.points)}">${signed(a.best.points)}</b>（${day(a.best.played_at)}）` : ""}${a.worst ? `　最慘 <b class="num ${cls(a.worst.points)}">${signed(a.worst.points)}</b>（${day(a.worst.played_at)}）` : ""}`;
  const recent = rec.length ? `<div class="card">
    <h3>最近 ${rec.length} 場</h3>
    <div class="bars">${bars}</div>
    <div class="axis"><span>較早</span><span>最近</span></div>
    <div class="muted" id="anBarInfo">${bestWorst}<br>點長條看那一場</div>
  </div>` : "";

  // ── 對上每個人 ──
  const maxOpp = Math.max(1, ...(solid.length ? solid : opp).map((r) => Math.abs(r.avgDiff)));
  const oppRow = (r) => `<details class="drow-wrap${r.games < min ? " few" : ""}">
    <summary class="drow">
      <span class="nm">${esc(r.name)}${r === nemesis ? `<span class="tag">剋星</span>` : ""}${r === atm ? `<span class="tag">提款機</span>` : ""}</span>
      ${dbar(r.avgDiff, maxOpp)}
      <span class="num val ${cls(r.avgDiff)}">${r0(r.avgDiff)}</span>
    </summary>
    <div class="more">同桌 ${r.games} 場・分數贏過他 ${pctS(r.aheadRate)}${r.p ? `<br>這幾場你的場均 <b class="num ${cls(r.p.avg)}">${r0(r.p.avg)}</b>、勝率 ${pctS(r.p.winRate)}` : ""}</div>
  </details>`;
  const opponents = `<div class="card">
    <h3>⚔️ 對上每個人</h3>

    ${opp.length ? `<div class="dlist">${solid.map(oppRow).join("")}</div>
      ${few.length ? `<details class="sub"><summary class="linkbtn">同桌不到 ${min} 場的 ${few.length} 人</summary><div class="dlist">${few.map(oppRow).join("")}</div></details>` : ""}`
      : `<div class="muted">沒有同桌紀錄</div>`}

  // ── 每月 ──

        <span class="nm">${Number(y) === thisYear ? `${Number(mo)} 月` : `${y}/${Number(mo)}`}<small>${m.games} 場・${pctS(m.wins / m.games)}</small></span>

  // ── 同桌組合（收起來） ──

  const shownTables = anShowAllTables ? a.tables : (solidTables.length ? solidTables : a.tables.slice(0, 5));
  const hiddenCount = a.tables.length - shownTables.length;
  const tableRows = shownTables.map((t) => `<tr class="${t.games < min ? "few" : ""}">
      <td title="${esc(t.names.join("、"))}">${t.names.length ? esc(t.names.join("、")) : "（只有自己）"}</td>
      <td class="num">${t.games}</td><td class="num">${pctS(t.winRate)}</td>
      <td class="num ${t.games < min ? "" : cls(t.avg)}">${r0(t.avg)}</td></tr>`).join("");
  const tables = `<details class="card fold" ${anShowAllTables ? "open" : ""}>

/** 試玩模式用：和後端 computeAnalysis 同樣的算法 */
function analyzeLocal(pid, players, games, scores) {
  const me = players.find((p) => p.id === pid);
  if (!me || me.is_house) return null;
  const nameOf = new Map(players.map((p) => [p.id, p.name]));
  const house = new Set(players.filter((p) => p.is_house).map((p) => p.id));
  const r1 = (n) => Math.round(n * 10) / 10;
  const mine = games.map((g) => {
    const gs = scores.filter((s) => s.game_id === g.id);
    const mineS = gs.find((s) => s.player_id === pid);
    return mineS ? { g, points: mineS.points, others: gs.filter((s) => s.player_id !== pid && !house.has(s.player_id)) } : null;
  }).filter(Boolean);
  const pts = mine.map((m) => m.points);
  const wins = pts.filter((p) => p > 0).length, total = pts.reduce((a, b) => a + b, 0), last10 = pts.slice(-10);
  let streak = 0;
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i]; if (p === 0) break;
    if (!streak) streak = p > 0 ? 1 : -1; else if ((p > 0) === (streak > 0)) streak += streak > 0 ? 1 : -1; else break;
  }
  let longestWinStreak = 0, run = 0;
  for (const p of pts) { run = p > 0 ? run + 1 : 0; longestWinStreak = Math.max(longestWinStreak, run); }
  let best = null, worst = null;
  for (const m of mine) {
    const ref = { game_id: m.g.id, played_at: m.g.played_at, points: m.points };
    if (!best || m.points > best.points) best = ref;
    if (!worst || m.points < worst.points) worst = ref;
  }
  const pAgg = new Map(), tAgg = new Map(), mAgg = new Map();
  for (const m of mine) {
    for (const o of m.others) {
      const a = pAgg.get(o.player_id) || { games: 0, wins: 0, total: 0, diff: 0, ahead: 0 };
      a.games++; if (m.points > 0) a.wins++; a.total += m.points; a.diff += m.points - o.points; if (m.points > o.points) a.ahead++;
      pAgg.set(o.player_id, a);
    }
    const ids = m.others.map((o) => o.player_id).sort(), key = ids.join(",");
    const t = tAgg.get(key) || { ids, games: 0, wins: 0, total: 0 };
    t.games++; if (m.points > 0) t.wins++; t.total += m.points; tAgg.set(key, t);
    const d = new Date(new Date(m.g.played_at).getTime() + 8 * 3600e3);
    const mk = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
    const mm = mAgg.get(mk) || { month: mk, games: 0, wins: 0, total: 0, avg: 0 };
    mm.games++; if (m.points > 0) mm.wins++; mm.total += m.points; mAgg.set(mk, mm);
  }
  return {
    player_id: pid, name: me.name, games: pts.length, wins, winRate: pts.length ? wins / pts.length : 0, total,
    avg: pts.length ? r1(total / pts.length) : 0,
    last10Avg: last10.length ? r1(last10.reduce((a, b) => a + b, 0) / last10.length) : 0, last10Games: last10.length,
    streak, longestWinStreak, best, worst,
    partners: [...pAgg].map(([id, a]) => ({ player_id: id, name: nameOf.get(id) || "?", games: a.games, wins: a.wins, winRate: a.wins / a.games, avg: r1(a.total / a.games), total: a.total }))
      .sort((x, y) => y.winRate - x.winRate || y.avg - x.avg || y.games - x.games),
    rivals: [...pAgg].map(([id, a]) => ({ player_id: id, name: nameOf.get(id) || "?", games: a.games, avgDiff: r1(a.diff / a.games), aheadRate: a.ahead / a.games }))
      .sort((x, y) => y.avgDiff - x.avgDiff || y.games - x.games),
    tables: [...tAgg.values()].map((a) => ({ player_ids: a.ids, names: a.ids.map((id) => nameOf.get(id) || "?"), games: a.games, wins: a.wins, winRate: a.wins / a.games, avg: r1(a.total / a.games), total: a.total }))
      .sort((x, y) => y.games - x.games || y.winRate - x.winRate),
    months: [...mAgg.values()].map((a) => ({ ...a, avg: r1(a.total / a.games) })).sort((x, y) => y.month.localeCompare(x.month)),
    recent: mine.slice(-20).map((m) => ({ game_id: m.g.id, played_at: m.g.played_at, points: m.points })),
  };
}

const PALETTE = ["#B83A2E", "#3B5BA9", "#C98A16", "#8E44AD", "#16A085", "#D35400"];
const MAX_PICK = PALETTE.length;
let trendPick = null; // 被強調的 player_id（依點選順序），null＝還沒選過，用預設
const trendColor = new Map(); // player_id -> 顏色，選取期間固定不變
function renderChart() {
  const { labels } = data.series;
  // 台費帳戶不畫；只畫有打過的人，依目前累計排序
  const house = new Set(data.players.filter((p) => p.house).map((p) => p.id));
  const active = data.series.series
    .filter((s) => !house.has(s.player_id) && s.values.some((v) => v !== 0))
    .sort((a, b) => b.values[b.values.length - 1] - a.values[a.values.length - 1]);
  const ctx = $("#chart");
  if (chart) { chart.destroy(); chart = null; }
  $("#chartEmpty").hidden = labels.length > 0;
  ctx.parentElement.hidden = !labels.length;
  $("#trendPick").hidden = !labels.length;
  if (!labels.length) return;

  const ids = new Set(active.map((s) => s.player_id));
  if (trendPick) trendPick = trendPick.filter((id) => ids.has(id));
  if (!trendPick || !trendPick.length) {
    // 預設：自己 + 目前第一名 + 最後一名
    const def = [data.me.player, active[0]?.player_id, active[active.length - 1]?.player_id];
    trendPick = [...new Set(def.filter((id) => id && ids.has(id)))];
  }
  for (const id of [...trendColor.keys()]) if (!trendPick.includes(id)) trendColor.delete(id);
  for (const id of trendPick) {
    if (!trendColor.has(id)) trendColor.set(id, PALETTE.find((c) => ![...trendColor.values()].includes(c)));

      renderChart();

  // 沒選的人畫成淡灰色當背景，選的人畫在最上層
  const bg = active.filter((s) => !colorOf.has(s.player_id));
  const fg = trendPick.map((id) => active.find((s) => s.player_id === id));

    type: "line",
    data: {
      labels: ["開始", ...labels],
      datasets: [
        ...bg.map((s) => ({
          label: s.name, data: [0, ...s.values], bg: true,
          borderColor: "rgba(122,133,127,.22)", borderWidth: 1.2, pointRadius: 0, pointHoverRadius: 0, tension: .25, order: 2,
        })),
        ...fg.map((s) => ({
          label: s.name, data: [0, ...s.values],

          borderWidth: 2.5, pointRadius: many ? 0 : 2.5, pointHoverRadius: 4, tension: .25, order: 1,
        })),
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (item) => !item.dataset.bg,
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: { label: (item) => ` ${item.dataset.label} ${signed(item.parsed.y)}` },
        },
      },
      scales: {

        y: {

          ticks: { font: { family: "JetBrains Mono" }, maxTicksLimit: 6 },
        },
      },
    },
  });
}

// ---------- 拆兩桌 ----------
const isHouse = (pid) => !!data.players.find((p) => p.id === pid)?.house;

/**
 * 找出把一場拆成兩桌的合理分法。
 * - 沒有台費帳戶：兩桌各自總和要剛好是 0
 * - 有台費帳戶（例如「東」）：台費依兩桌各自的輸贏分配，兩桌分到的台費都不能是負的
 * 排序：每桌越接近 4 人越前面，其次兩桌台費越平均越前面。
 */
function findSplits(scores, max = Infinity) {
  const houses = scores.filter((s) => isHouse(s.player_id));
  const house = houses.length === 1 ? houses[0] : null; // 多個台費帳戶時當一般玩家處理
  const others = scores.filter((s) => s !== house);
  const n = others.length, H = house ? house.points : 0, out = [];
  if (n < 4 || n > 16) return out;
  for (let m = 1; m < (1 << n); m += 2) { // 第一個人固定在桌 1，避免同一種分法出現兩次
    const A = others.filter((_, i) => (m >> i) & 1), B = others.filter((_, i) => !((m >> i) & 1));
    if (A.length < 2 || B.length < 2) continue;
    const sumA = A.reduce((a, s) => a + s.points, 0), sumB = B.reduce((a, s) => a + s.points, 0);
    let hA = 0, hB = 0;
    if (house) {
      hA = -sumA; hB = -sumB;
      if (hA * H < 0 || hB * H < 0) continue; // 台費方向要和原本一樣（通常是收錢）
    } else if (sumA !== 0) continue;
    const sizePenalty = (A.length - 4) ** 2 + (B.length - 4) ** 2;
    const feeGap = house && H ? Math.abs(hA - hB) / Math.abs(H) : 0;
    out.push({ A, B, hA, hB, score: sizePenalty * 10 + feeGap });
  }
  return out.sort((x, y) => x.score - y.score).slice(0, max).map((c) => ({ ...c, house }));
}

/**
 * 拆桌面板：scores 是 {player_id, name, points}[]；確認後呼叫 opts.onConfirm(各桌的分數)
 * 每個人可以選「桌1／桌2／兩桌」。選「兩桌」（例如中途換桌、打了兩邊）時，
 * 輸入他在桌 1 的分數，桌 2 自動補成原本總分減掉桌 1。
 */
function openSplit(host, scores, opts) {
  const houses = scores.filter((s) => isHouse(s.player_id));
  const house = houses.length === 1 ? houses[0] : null;
  const others = scores.filter((s) => s !== house);
  const all = findSplits(scores);
  const cands = all.slice(0, 6);
  const assign = new Map(others.map((s, i) => [s.player_id, i < Math.ceil(others.length / 2) ? 0 : 1]));
  const part1 = new Map(); // 選「兩桌」的人在桌 1 的分數
  let picked = -1;

  const box = document.createElement("div");
  box.className = "split";
  host.appendChild(box);

  const pickCand = (i) => {
    picked = i;
    const c = cands[i];
    for (const s of c.A) assign.set(s.player_id, 0);
    for (const s of c.B) assign.set(s.player_id, 1);
    draw();
  };

  /** 依目前分配，算出兩桌各自的分數（台費帳戶依兩桌輸贏補齊） */
  function tables() {
    const t = [[], []];
    for (const s of others) {
      const a = assign.get(s.player_id);
      if (a === 2) {
        const x = part1.get(s.player_id) ?? 0;
        t[0].push({ player_id: s.player_id, points: x, name: s.name, part: true });
        t[1].push({ player_id: s.player_id, points: s.points - x, name: s.name, part: true });
      } else {
        t[a].push({ player_id: s.player_id, points: s.points, name: s.name });
      }
    }
    const shares = t.map((rows) => -rows.reduce((a, e) => a + e.points, 0));
    if (house) shares.forEach((h, i) => { if (h !== 0) t[i].push({ player_id: house.player_id, points: h, name: house.name }); });
    return { t, shares };
  }

  /** 剛切成「兩桌」時的預設：沒有台費帳戶 → 讓桌 1 剛好平衡；有 → 讓兩桌台費一樣（取 50 的倍數） */
  function defaultPart(pid) {
    const me = others.find((s) => s.player_id === pid);
    let sA = 0, sB = 0;
    for (const s of others) {
      if (s.player_id === pid) continue;
      const a = assign.get(s.player_id);
      if (a === 0) sA += s.points;
      else if (a === 1) sB += s.points;
      else { const x = part1.get(s.player_id) ?? 0; sA += x; sB += s.points - x; }
    }
    if (!house) return -sA;
    return Math.round((sB + me.points - sA) / 2 / 50) * 50;
  }

  function problems({ t, shares }) {
    const msgs = [];
    t.forEach((rows, i) => { if (rows.length < 2) msgs.push(`桌 ${i + 1} 人數不夠`); });
    for (const s of others) if (assign.get(s.player_id) === 2 && !Number.isInteger(part1.get(s.player_id))) msgs.push(`請輸入${s.name}在桌 1 的分數`);
    if (house) {
      shares.forEach((h, i) => { if (h * house.points < 0) msgs.push(`桌 ${i + 1} 的${house.name}會變成 ${signed(h)}`); });
    } else {
      shares.forEach((h, i) => { if (h !== 0) msgs.push(`桌 ${i + 1} 總和 ${signed(-h)}，要是 0`); });
    }
    return msgs;
  }

  const names = (rows) => rows.filter((e) => !house || e.player_id !== house.player_id)
    .map((e) => esc(e.name) + (e.part ? `(${signed(e.points)})` : "")).join("、");

  /** 只更新下方的兩桌摘要和按鈕（輸入分數時不重畫整個面板，避免鍵盤收起來） */
  function drawStatus() {
    const cur = tables(), errs = problems(cur);
    box.querySelector(".tsum").innerHTML = cur.t.map((rows, i) => `<div>
        <b>桌 ${i + 1}</b>　${rows.filter((e) => !house || e.player_id !== house.player_id).length} 人<br>
        <span class="muted">${names(rows) || "—"}</span>
        ${house ? `<br>${esc(house.name)}：<b class="num">${signed(cur.shares[i])}</b>` : `<br>總和：<b class="num">${signed(-cur.shares[i])}</b>`}
      </div>`).join("");
    const hint = box.querySelector(".splithint");
    hint.style.display = errs.length ? "block" : "none";
    hint.textContent = errs.join("；");
    box.querySelector('[data-act="ok"]').disabled = errs.length > 0;
    for (const s of others) {
      const out = box.querySelector(`.part2[data-pid="${s.player_id}"]`);
      if (out) out.textContent = signed(s.points - (part1.get(s.player_id) ?? 0));
    }
  }

  function draw() {
    box.innerHTML = `
      <div class="muted">${cands.length
        ? `找到 ${all.length} 種兩桌都對得上的分法${all.length > cands.length ? `，列出最可能的 ${cands.length} 種` : ""}${house ? `（「${esc(house.name)}」的台費依兩桌輸贏自動分配）` : ""}。數字只能確定總和，請選實際上的那一種，或在下面手動調整。`
        : `找不到兩桌都剛好對得上的分法，請在下面手動調整。`}
        有人兩桌都打過（例如中途換桌），把他選成「兩桌」，再填他在桌 1 的分數。</div>
      ${cands.length ? `<h4>建議的分法</h4><div class="cands">${cands.map((c, i) => `
        <button class="cand ${i === picked ? "on" : ""}" data-i="${i}">
          <b>桌 1</b>：${c.A.map((s) => esc(s.name)).join("、")}${house ? `（${esc(house.name)} ${signed(c.hA)}）` : ""}<br>
          <b>桌 2</b>：${c.B.map((s) => esc(s.name)).join("、")}${house ? `（${esc(house.name)} ${signed(c.hB)}）` : ""}
        </button>`).join("")}</div>` : ""}
      <h4>每個人在哪一桌</h4>
      <div class="assign">${others.map((s) => {
        const a = assign.get(s.player_id);
        return `
        <div class="arow"><span>${esc(s.name)}</span><b class="num ${cls(s.points)}">${signed(s.points)}</b>
          <span class="seg" data-pid="${s.player_id}">
            <button class="${a === 0 ? "on" : ""}" data-t="0">桌1</button><button class="${a === 1 ? "on" : ""}" data-t="1">桌2</button><button class="${a === 2 ? "on" : ""}" data-t="2">兩桌</button>
          </span></div>
        ${a === 2 ? `<div class="partrow">
          <span>桌 1</span>
          <button class="pm" data-pid="${s.player_id}" type="button" aria-label="切換正負">±</button>
          <input class="partin" data-pid="${s.player_id}" inputmode="numeric" value="${part1.get(s.player_id) ?? ""}" placeholder="0" aria-label="${esc(s.name)}在桌 1 的分數">
          <span>桌 2</span><b class="num part2" data-pid="${s.player_id}"></b>
        </div>` : ""}`;
      }).join("")}</div>
      <div class="tsum"></div>
      <div class="datehint splithint"></div>
      <div class="inline">
        <button class="btn small" data-act="ok">${opts.okLabel || "確認拆成兩桌"}</button>
        <button class="btn small ghost" data-act="cancel">取消</button>
      </div>`;
    box.querySelectorAll(".cand").forEach((b) => b.onclick = () => pickCand(Number(b.dataset.i)));
    box.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
      const pid = b.parentElement.dataset.pid, t = Number(b.dataset.t);
      if (t === 2 && assign.get(pid) !== 2) { assign.set(pid, 2); part1.set(pid, defaultPart(pid)); }
      else assign.set(pid, t);
      picked = -1; draw();
    });
    box.querySelectorAll(".partin").forEach((inp) => inp.oninput = () => {
      const v = inp.value.replace(/[^\d-]/g, "").replace(/(?!^)-/g, "");
      inp.value = v;
      part1.set(inp.dataset.pid, v === "" || v === "-" ? NaN : parseInt(v, 10));
      drawStatus();
    });
    box.querySelectorAll(".pm").forEach((b) => b.onclick = () => {
      const pid = b.dataset.pid, x = part1.get(pid);
      if (Number.isInteger(x)) { part1.set(pid, -x); box.querySelector(`.partin[data-pid="${pid}"]`).value = String(-x); drawStatus(); }
    });
    box.querySelector('[data-act="cancel"]').onclick = () => box.remove();
    box.querySelector('[data-act="ok"]').onclick = async () => {
      const { t } = tables();
      const payload = t.map((rows) => rows.map(({ player_id, points }) => ({ player_id, points })));
      if (!confirm(opts.confirmText(names(t[0]).replace(/<[^>]+>/g, ""), names(t[1]).replace(/<[^>]+>/g, "")))) return;
      const ok = box.querySelector('[data-act="ok"]'); ok.disabled = true;
      try { await opts.onConfirm(payload); box.remove(); await load(); }
      catch (e) { toast(e.message); ok.disabled = false; }
    };
    drawStatus();
  }

  if (cands.length) pickCand(0); else draw();
}

boot();
</script>
</body>
</html>
